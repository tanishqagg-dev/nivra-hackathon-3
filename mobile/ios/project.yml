name: Nivra
options:
  bundleIdPrefix: work.tanishq
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    DEVELOPMENT_TEAM: ''
targets:
  Nivra:
    type: application
    platform: iOS
    sources:
      - path: Nivra
      - path: Models/NivraX3D.mlpackage
      - path: Models/provenance.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.tanishq.nivra.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: '1.0.0'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Nivra/Info.plist
        CODE_SIGN_ENTITLEMENTS: Nivra/Nivra.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [NivraTests]
  NivraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NivraTests
    dependencies:
      - target: Nivra
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: work.tanishq.nivra.tests
